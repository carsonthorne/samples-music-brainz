<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Music Graph</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #graph { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
    
  <div id="ui">
    <form id="search-form">
      <input
        id="search-input"
        type="search"
        placeholder="Search artists"
        autocomplete="off"
      />
      <select id="search-type" aria-label="Search type">
        <option value="artist" selected>Artist</option>
        <option value="album">Album</option>
        <option value="track">Track</option>
      </select>
    </form>

    <div id="status" aria-live="polite"></div>
    <div id="controls">
      <button id="fit-canvas" class="icon-button" type="button" aria-label="Fit graph" title="Fit graph">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M16 3h3a2 2 0 0 1 2 2v3" />
          <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
          <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
          <path d="M9 12h6" />
          <path d="M12 9v6" />
        </svg>
      </button>

      <button id="toggle-orbit" class="icon-button" type="button" aria-pressed="false" aria-label="Start orbit" title="Start orbit">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="2.25" />
          <path d="M4.5 12a7.5 3.8 0 1 0 15 0a7.5 3.8 0 1 0-15 0" />
          <path d="M16.4 8.1a7.5 3.8 58 1 0-8.8 7.8a7.5 3.8 58 1 0 8.8-7.8" />
        </svg>
      </button>

      <button id="collapse-all" class="icon-button" type="button" aria-label="Collapse all" title="Collapse all">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3v5H3" />
          <path d="M16 3v5h5" />
          <path d="M8 21v-5H3" />
          <path d="M16 21v-5h5" />
          <path d="M3 8l6 6" />
          <path d="M21 8l-6 6" />
          <path d="M3 16l6-6" />
          <path d="M21 16l-6-6" />
        </svg>
      </button>
    </div>

    <div id="search-results"></div>

    <button id="toggle-panel" class="icon-button" type="button" aria-pressed="true" aria-label="Hide panel" title="Hide panel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
        <path d="M6 8h.01" />
        <path d="M6 12h.01" />
        <path d="M6 16h.01" />
      </svg>
    </button>
  </div>

  <div id="graph"></div>

  <aside id="details-panel" hidden aria-label="Node details">
    <div id="details-panel-nav">
      <button id="details-panel-back" type="button" aria-label="Back">
        Back
      </button>
      <button id="details-panel-forward" type="button" aria-label="Forward">
        Forward
      </button>
      <button id="details-panel-connections" type="button">
        Show Artist Connections
      </button>
    </div>
    <div id="details-panel-body"></div>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
